<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90" role="img" aria-label="Space Café Amara Logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g transform="translate(10, 10)">
    <!-- Untertasse -->
    <ellipse cx="35" cy="66" rx="30" ry="6" fill="#3b2a22" opacity="0.15"/>

    <!-- Tasse -->
    <path d="M10 28 H58 V50 C58 61 49 68 34 68 C19 68 10 61 10 50 Z" fill="#3b2a22"/>
    <!-- Henkel -->
    <path d="M58 34 C72 34 72 54 58 54" fill="none" stroke="#3b2a22" stroke-width="5" stroke-linecap="round"/>

    <!-- Orbit-Ring (Space-Element) -->
    <ellipse cx="34" cy="14" rx="22" ry="7" fill="none" stroke="#432a64" stroke-width="2.5" transform="rotate(-18 34 14)"/>
    <!-- Planet/Stern auf dem Ring -->
    <circle cx="53" cy="9" r="4" fill="#432a64"/>
    <!-- kleiner Stern -->
    <circle cx="15" cy="4" r="1.6" fill="#432a64" opacity="0.8"/>
  </g>

  <!-- Wordmark -->
  <text x="88" y="38" font-family="'Fraunces', Georgia, serif" font-weight="600" font-size="26" fill="#3b2a22">Café Amara</text>
  <text x="89" y="56" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="12" letter-spacing="3" fill="#432a64">SPACE EDITION</text>
</svg>
